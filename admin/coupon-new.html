<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New coupon - Janz Admin</title>
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="vendors/perfect-scrollbar/perfect-scrollbar.css" />
    <link rel="stylesheet" href="vendors/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/janz-admin.css" />
    <script>if (localStorage.getItem("janz-theme") === "day") document.documentElement.classList.add("theme-day");</script>
</head>
<body>
    <div id="app">
        <div id="sidebar" class="active">
            <div class="sidebar-wrapper active">
                <div class="sidebar-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <a class="logo" aria-label="Janz admin" href="index.html">
                            <span class="logo-mark" aria-hidden="true">J</span>
                            <span class="logo-name">Janz</span>
                            <span class="logo-tag">Admin</span>
                        </a>
                        <div class="toggler">
                            <a href="#" class="sidebar-hide d-xl-none d-block" aria-label="Close menu"><i class="bi bi-x bi-middle"></i></a>
                        </div>
                    </div>
                </div>
                <div class="sidebar-menu">
                    <ul class="menu">
                        <li class="sidebar-title">Menu</li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="index.html">
                                <i class="bi bi-grid-1x2"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>

                        <li class="sidebar-title">Shop</li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="products.html">
                                <i class="bi bi-box-seam"></i>
                                <span>Products</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="categories.html">
                                <i class="bi bi-tags"></i>
                                <span>Categories</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="orders.html">
                                <i class="bi bi-bag-check"></i>
                                <span>Orders</span>
                            </a>
                        </li>
                        <li class="sidebar-item active">
                            <a class="sidebar-link" href="coupons.html">
                                <i class="bi bi-percent"></i>
                                <span>Coupons</span>
                            </a>
                        </li>

                        <li class="sidebar-title">Customers</li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="users.html">
                                <i class="bi bi-people"></i>
                                <span>Users</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="reviews.html">
                                <i class="bi bi-star"></i>
                                <span>Reviews</span>
                            </a>
                        </li>

                        <li class="sidebar-title">Account</li>
                        <li class="sidebar-item">
                            <a class="sidebar-link" href="../index.html">
                                <i class="bi bi-shop"></i>
                                <span>Go to site</span>
                            </a>
                        </li>
                        <li class="sidebar-item">
                            <form method="post" data-demo action="#">
                                <button type="submit" class="sidebar-link sidebar-button">
                                    <i class="bi bi-box-arrow-left"></i>
                                    <span>Sign out</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="main">
            <header class="admin-top">
                <a href="#" class="burger-btn d-block d-xl-none" aria-label="Open menu"><i class="bi bi-list"></i></a>
                <div class="admin-top-title">New coupon</div>
                <button class="admin-theme" type="button" aria-label="Day mode"><i class="bi bi-sun"></i></button>
                <div class="admin-user">
                    <span class="admin-avatar" aria-hidden="true">J</span>
                    <div>
                        <div class="admin-user-name">Janz Admin</div>
                        <div class="admin-user-role">Administrator</div>
                    </div>
                </div>
            </header>

            <div class="page-heading">
<section class="admin-head">
    <div>
        <p class="admin-eyebrow"><a href="coupons.html">Coupons</a> / New</p>
        <h1>New coupon</h1>
    </div>
</section>

<form class="admin-form admin-card admin-form-narrow" method="post" data-demo action="#">
    <div class="admin-form-grid">
        <label class="admin-field admin-field-wide">
            <span>Code</span>
            <div class="admin-input-row">
                <input name="code" value="" required maxlength="20" pattern="[A-Z0-9]+" placeholder="WELCOME10" data-upper />
                <button type="button" class="admin-btn is-ghost" data-generate>Generate</button>
            </div>
            <small>Capital letters and digits only.</small>
        </label>
        <label class="admin-field">
            <span>Type</span>
            <select name="type">
                <option value="Percent" selected>Percent, %</option>
                <option value="Fixed">Fixed, ₼</option>
            </select>
        </label>
        <label class="admin-field">
            <span>Value</span>
            <input name="value" type="number" min="1" step="0.01" value="" required />
        </label>
        <label class="admin-field">
            <span>Min order, ₼</span>
            <input name="minOrder" type="number" min="0" step="0.01" value="0" />
        </label>
        <label class="admin-field">
            <span>Usage limit</span>
            <input name="limit" type="number" min="1" value="100" />
        </label>
        <label class="admin-field">
            <span>Starts</span>
            <input name="startsAt" type="date" value="2026-10-22" />
        </label>
        <label class="admin-field">
            <span>Ends</span>
            <input name="endsAt" type="date" value="2026-12-31" />
        </label>
        <label class="admin-check admin-field-wide">
            <input name="isActive" type="checkbox" checked />
            <span>Active</span>
        </label>
    </div>
    <div class="admin-form-actions">
        <button type="submit" class="admin-btn">Create</button>
        <a class="admin-btn is-ghost" href="coupons.html">Cancel</a>
    </div>
</form>
            </div>

            <footer class="admin-footer">
                <span>© 2026 Janz</span>
                <span>Admin panel</span>
            </footer>
        </div>
    </div>

    <script src="vendors/perfect-scrollbar/perfect-scrollbar.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Gündüz/gecə: saytla eyni açar (janz-theme), ona görə seçim hər iki tərəfdə eyni qalır
        document.querySelector(".admin-theme").addEventListener("click", function () {
            var day = document.documentElement.classList.toggle("theme-day");
            localStorage.setItem("janz-theme", day ? "day" : "night");
        });
        // Silmədən əvvəl soruşulur
        document.querySelectorAll("form[data-confirm]").forEach(function (form) {
            form.addEventListener("submit", function (event) {
                if (!confirm(form.getAttribute("data-confirm"))) { event.preventDefault(); event.stopImmediatePropagation(); }
            });
        });
    </script>
    
    <script src="js/admin-demo.js"></script>
</body>
</html>
